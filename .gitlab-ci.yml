add-model-cards:
  image: mcr.microsoft.com/playwright/python:v1.64.0
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - model_slugs.txt
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip_cache
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key:
      files:
        - .gitlab-ci.yml
    path:
      - .pip_cache
  before_script:
    - pip install "playwright==1.64.0" "huggingface_hub==1.14.0" "scancode-toolkit==32.5.0"
  script:
    - bash scripts/add_new_models.sh
